<footer class="site-footer">
  <div class="site-footer__inner">
    <div>
      <strong>{{ site.Params.lab_name }}</strong>
      <p>{{ site.Params.institution }}</p>
    </div>
    <div>
      <p>© {{ now.Year }} {{ site.Params.lab_name }}. {{ site.Params.location }}</p>
      <p>
        <a class="footer-email" href="mailto:{{ site.Params.email }}">
          {{ partial "fontawesome-icon.html" (dict "icon" "envelope") }}
          <span>{{ site.Params.email }}</span>
        </a>
      </p>
    </div>
  </div>
</footer>
